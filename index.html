<title>DSP Router — AdLib (restricted)</title>
<style>
  :root{--bg:#eef1f6;--surface:#fff;--ink:#171a21;--muted:#737c8c;--line:#dde2ec;
    --accent:#2e5cff;--accent-ink:#1c3fcc;--accent-wash:#e7edff;--err:#e5484d;
    --mono:"SF Mono",ui-monospace,"Cascadia Code",Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;}
  @media (prefers-color-scheme:dark){:root{--bg:#0d1016;--surface:#161b23;--ink:#e8ebf2;
    --muted:#7d8797;--line:#29313d;--accent:#6d8bff;--accent-ink:#a9bcff;--accent-wash:#1a2440;}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
    color:var(--ink);font-family:var(--sans);padding:24px}
  .lock{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);
    border-radius:16px;padding:30px 26px;box-shadow:0 1px 2px rgba(16,22,40,.06),0 18px 44px -16px rgba(16,22,40,.28)}
  .brand{display:flex;align-items:center;gap:9px;margin-bottom:16px}
  .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);box-shadow:0 0 0 4px var(--accent-wash)}
  .brand .k{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1{margin:0 0 6px;font-size:20px;letter-spacing:-.02em}
  p.sub{margin:0 0 20px;color:var(--muted);font-size:13.5px;line-height:1.5}
  label{display:block;font-size:12px;font-family:var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
  .field+.field{margin-top:14px}
  input{width:100%;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:10px;padding:11px 13px}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  button{width:100%;margin-top:20px;font:inherit;font-size:14.5px;font-weight:600;cursor:pointer;
    color:#fff;background:var(--accent);border:0;border-radius:10px;padding:12px;transition:filter .15s}
  button:hover{filter:brightness(1.07)}
  button:disabled{opacity:.6;cursor:progress}
  .err{margin-top:14px;font-size:13px;color:var(--err);min-height:18px;text-align:center}
  .foot{margin-top:18px;text-align:center;font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted)}
</style>
</head>
<body>
  <form class="lock" id="f" autocomplete="off">
    <div class="brand"><span class="dot"></span><span class="k">AdLib · Internal Tool</span></div>
    <h1>DSP Campaign Router</h1>
    <p class="sub">This page is access-restricted. Enter the team credentials to open it.</p>

    <div class="field"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" /></div>
    <button type="submit" id="go">Unlock</button>
    <div class="err" id="err" role="alert"></div>

const ITER=250000;
function b64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function unlock(user,pass){
  const raw=b64(DATA);
  const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey("raw",enc.encode(user+":"+pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const buf=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  return new TextDecoder("utf-8").decode(buf);
}
